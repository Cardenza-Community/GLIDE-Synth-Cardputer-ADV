; GLIDE — continuous-pitch polyphonic slide synth for the M5Stack Cardputer ADV
;
;   cardputer-adv : the instrument        -> pio run                  -> dist/GLIDE.bin
;   phase0-probe  : hardware risk probe   -> pio run -e phase0-probe  (audio streaming + key rollover)
;   native        : host build of the pure DSP core (portability gate) -> pio run -e native
;
; Flash via bmorcelli Launcher: copy dist/GLIDE.bin to /apps/ on the SD card.
; Direct USB flash (overwrites Launcher): pio run -t upload
;   (entry: power OFF, hold G0, plug USB-C, release G0)

[platformio]
default_envs = unified

[base]
; shared device settings — the exact stack the proven sibling firmwares use
platform = espressif32@6.12.0
board = esp32-s3-devkitc-1
framework = arduino
board_build.mcu = esp32s3
board_build.flash_size = 8MB
; Match Cardenza's QIO bootloader and original Cardputer app SDK driver.
; The precompiled Arduino SDK still emits a DIO app header; changing only
; that header cannot enable quad mode in the shared bootloader.
board_build.flash_mode = qio
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
upload_speed = 921600
build_flags =
    -DESP32S3
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=2
    -Wl,--wrap=nvs_flash_erase
    -Wl,--wrap=esp_partition_erase_range
lib_deps =
    m5stack/M5Cardputer@1.1.1
    https://github.com/203Null/M5Unified.git#74fe31c6d9a2bd7c04f81eb4f8f0af99262e3bc2
    m5stack/M5GFX@0.2.31

[env:cardputer-adv]
extends = base
build_src_filter =
    +<*>
    -<phase0_probe.cpp>
    -<nvsfill_tool.cpp>
    -<test_dsp.cpp>
extra_scripts = post:support/copy_dist.py

[env:phase0-probe]
extends = base
build_src_filter =
    +<phase0_probe.cpp>
    +<launcher_nvs_guard.cpp>
extra_scripts = post:support/copy_dist.py

[env:nvsfill]
; STORAGE FULL test harness — fills the shared NVS partition with junk so a
; healthy unit reproduces the full-partition state, to exercise the boot
; warning + BKSP whole-partition recovery in main.cpp/eraseAllStorage.
extends = base
build_src_filter =
    +<nvsfill_tool.cpp>
    +<launcher_nvs_guard.cpp>
extra_scripts = post:support/copy_dist.py

[env:native]
platform = native
build_flags =
    -std=gnu++14
    -O2
    ; Pin float math to IEEE single-precision SSE. The pio mingw toolchain is
    ; 32-bit gcc whose default x87 codegen carries excess precision, and one
    ; borderline product ((float)0.35 * 100 at a hash-quantise boundary) then
    ; truncates differently than the device's hardware FPU — which flipped a
    ; frozen-generator golden hash. SSE math matches the ESP32's single-
    ; precision semantics, so the goldens mean the same thing on both sides.
    -msse2
    -mfpmath=sse
    -DGLIDE_HOST_BUILD
build_src_filter =
    +<test_dsp.cpp>
    +<dsp/>
    +<storage/patch_codec.cpp>  ; host-safe (only <cstring> + dsp/params.h) — lets
                                ; test_dsp.cpp cover the tagged patch codec
    +<storage/patch_name.cpp>   ; host-safe (freestanding) — the SD naming rules,
                                ; which io/sd_store.cpp can never host-build
    +<ui/theme.cpp>             ; host-safe (only theme.h + <cstdint>) — puts the
                                ; custom-palette derivation and its contrast
                                ; guardrails under the same gate as the sound
                                ; generator's. It is also what support/viz_render
                                ; already links, so the tests and the contact
                                ; sheet judge exactly the same colours.

[env:unified]
extends = env:cardputer-adv

; Compatibility aliases now produce the same runtime-detecting application.
[env:cardenza]
extends = env:unified
